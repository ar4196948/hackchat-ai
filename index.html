<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>HACKCHAT - CYBER TERMINAL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: #000000;
      color: #00ff00;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Consolas, Courier, monospace;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: pan-y;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      padding: 6px;
      gap: 6px;
    }

    /* TOP 2 CHOTAY BOXES */
    .top-section {
      height: 90px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      flex-shrink: 0;
    }

    .hacker-window {
      border: 1.5px solid #00ff00;
      background: #000000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 8px rgba(0, 255, 0, 0.25);
    }

    .window-title {
      background: #00ff00;
      color: #000000;
      font-weight: 900;
      font-size: 11px;
      padding: 2px 6px;
      display: flex;
      justify-content: space-between;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .window-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* CHAT WINDOW */
    .chat-window {
      flex: 1;
      min-height: 0;
      border: 2px solid #00ff00;
      background: #000000;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 12px rgba(0, 255, 0, 0.35);
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #020a02;
      font-size: 15px;
      line-height: 1.5;
      -webkit-overflow-scrolling: touch;
    }

    .msg-user {
      color: #ffffff;
      background: rgba(0, 255, 0, 0.15);
      padding: 8px 12px;
      border-left: 4px solid #00ff00;
      word-break: break-word;
      font-weight: 500;
    }
    .msg-user::before {
      content: "USER@ROOT:~$ ";
      color: #00ff00;
      font-weight: 900;
    }

    .msg-bot {
      color: #00ff41;
      padding: 8px 12px;
      border-left: 4px solid #00aa00;
      white-space: pre-wrap;
      word-break: break-word;
      font-weight: 500;
    }
    .msg-bot-prefix {
      color: #38ef7d;
      font-weight: 900;
    }

    .msg-status {
      color: #ffff00;
      font-size: 12px;
      font-style: italic;
    }

    .msg-error {
      color: #ff4d4d;
      border-left: 4px solid #ff4d4d;
    }

    /* FIXED INPUT SECTION */
    .input-section {
      background: #041604;
      border-top: 2px solid #00ff00;
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .input-label {
      color: #00ff00;
      font-weight: 900;
      font-size: 14px;
    }

    .user-text-input {
      flex: 1;
      background: #000000;
      border: 1.5px solid #00ff00;
      color: #ffffff;
      font-size: 16px !important; 
      padding: 10px 12px;
      outline: none;
      border-radius: 4px;
    }
    .user-text-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
    }

    .send-button {
      background: #00ff00;
      color: #000000;
      border: none;
      padding: 10px 18px;
      font-weight: 900;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    .send-button:active {
      background: #ffffff;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: #00ff00;
      margin-left: 3px;
      animation: blink 0.7s infinite;
      vertical-align: middle;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <!-- TOP SECTION -->
    <div class="top-section">
      <div class="hacker-window">
        <div class="window-title">
          <span>Signal // [WAVE]</span>
          <span>_ [] X</span>
        </div>
        <div class="window-content">
          <canvas id="oscCanvas" style="width:100%; height:100%; display:block;"></canvas>
        </div>
      </div>

      <div class="hacker-window">
        <div class="window-title">
          <span>Digital // [BIT_FALL]</span>
          <span>_ [] X</span>
        </div>
        <div class="window-content">
          <canvas id="binaryCanvas" style="width:100%; height:100%; display:block;"></canvas>
        </div>
      </div>
    </div>

    <!-- MAIN CHAT WINDOW -->
    <div class="chat-window">
      <div class="window-title">
        <span id="consoleTitle">Program Console // [HACKCHAT]</span>
        <span style="cursor:pointer;" onclick="clearMemory()">[RESET MEMORY]</span>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="msg-bot" id="initMessage">
          >>> [HACKCHAT]: SYSTEM READY. Memory buffer optimized. Sawal likhein!
        </div>
      </div>

      <div class="input-section">
        <span class="input-label">CMD></span>
        <input 
          type="text" 
          id="userInputField" 
          class="user-text-input" 
          placeholder="Type your message..." 
          autocomplete="off"
        />
        <button id="sendBtn" class="send-button" type="button">SEND</button>
      </div>
    </div>

  </div>

  <script>
    const GROQ_API_KEY = "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";

    const chatMessages = document.getElementById("chatMessages");
    const userInputField = document.getElementById("userInputField");
    const sendBtn = document.getElementById("sendBtn");
    const initMessage = document.getElementById("initMessage");
    const consoleTitle = document.getElementById("consoleTitle");

    let activeModel = "qwen/qwen3.8-27b";

    let chatHistory = [
      { 
        role: "system", 
        content: "You are HACKCHAT. Reply in friendly Roman Urdu or English only. Keep answers concise, clear, and sharp. Never speak Arabic." 
      }
    ];

    function clearMemory() {
      chatHistory = [
        { role: "system", content: "You are HACKCHAT. Reply in friendly Roman Urdu or English only." }
      ];
      chatMessages.innerHTML = '<div class="msg-bot">>>> [HACKCHAT]: Memory cleared. Buffer reset!</div>';
    }

    async function setupModel() {
      try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": `Bearer ${GROQ_API_KEY}` }
        });
        const data = await res.json();
        
        if (data.data && Array.isArray(data.data)) {
          const valid = data.data.filter(m => {
            const id = m.id.toLowerCase();
            return !id.includes("arabic") && 
                   !id.includes("orpheus") && 
                   !id.includes("canopylabs") && 
                   !id.includes("guard") && 
                   !id.includes("whisper") && 
                   !id.includes("vision") && 
                   !id.includes("embed");
          });
          if (valid.length > 0) {
            activeModel = valid[0].id;
          }
        }
        consoleTitle.textContent = `Program Console // [HACKCHAT - ${activeModel}]`;
        initMessage.textContent = `>>> [HACKCHAT]: SYSTEM ONLINE (${activeModel}). Ready for input!`;
      } catch (e) {
        initMessage.textContent = `>>> [HACKCHAT]: SYSTEM ONLINE. Ready for input!`;
      }
    }
    setupModel();

    sendBtn.addEventListener("click", executeCommand);
    userInputField.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        executeCommand();
      }
    });

    async function executeCommand() {
      const text = userInputField.value.trim();
      if (!text) return;

      const userMsg = document.createElement("div");
      userMsg.className = "msg-user";
      userMsg.textContent = text;
      chatMessages.appendChild(userMsg);

      userInputField.value = "";
      sendBtn.disabled = true;

      // Add user message to history
      chatHistory.push({ role: "user", content: text });

      // SMART MEMORY LIMITER:
      // Agar history 6 messages se zyada ho jaye, toh purane messages hata do
      // taake "Request too large" ka error kabhi na aaye!
      if (chatHistory.length > 6) {
        chatHistory = [chatHistory[0], ...chatHistory.slice(-5)];
      }

      chatMessages.scrollTop = chatMessages.scrollHeight;

      const statusDiv = document.createElement("div");
      statusDiv.className = "msg-status";
      statusDiv.textContent = `>>> [TRANSMITTING PACKETS...]`;
      chatMessages.appendChild(statusDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${GROQ_API_KEY}`
          },
          body: JSON.stringify({
            model: activeModel,
            messages: chatHistory,
            max_tokens: 600 // Extra tokens roko taake request safe rahe
          })
        });

        const data = await response.json();
        statusDiv.remove();

        if (!response.ok) {
          showError(data.error?.message || "Server rejected request.");
          return;
        }

        const reply = data.choices[0].message.content;
        chatHistory.push({ role: "assistant", content: reply });

        await typeWordByWord(reply);

      } catch (err) {
        statusDiv.remove();
        showError("CONNECTION FAILED: " + err.message);
      } finally {
        sendBtn.disabled = false;
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    function typeWordByWord(fullText) {
      return new Promise((resolve) => {
        const botMsg = document.createElement("div");
        botMsg.className = "msg-bot";
        botMsg.innerHTML = '<span class="text-body"></span><span class="cursor"></span>';
        chatMessages.appendChild(botMsg);

        const textBody = botMsg.querySelector(".text-body");
        const cursor = botMsg.querySelector(".cursor");

        const words = fullText.split(" ");
        let index = 0;

        const timer = setInterval(() => {
          if (index < words.length) {
            textBody.textContent += (index === 0 ? "" : " ") + words[index];
            chatMessages.scrollTop = chatMessages.scrollHeight;
            index++;
          } else {
            clearInterval(timer);
            cursor.remove();
            resolve();
          }
        }, 22);
      });
    }

    function showError(errText) {
      const errDiv = document.createElement("div");
      errDiv.className = "msg-bot msg-error";
      errDiv.textContent = ">>> [ERROR]: " + errText;
      chatMessages.appendChild(errDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // --- OSCILLOSCOPE ---
    const oscCanvas = document.getElementById("oscCanvas");
    const oCtx = oscCanvas.getContext("2d");
    let waveStep = 0;

    function resizeOsc() {
      oscCanvas.width = oscCanvas.parentElement.clientWidth;
      oscCanvas.height = oscCanvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resizeOsc);
    setTimeout(resizeOsc, 50);

    function renderWave() {
      oCtx.fillStyle = "#000000";
      oCtx.fillRect(0, 0, oscCanvas.width, oscCanvas.height);

      oCtx.strokeStyle = "rgba(0, 255, 0, 0.15)";
      oCtx.lineWidth = 1;
      for (let x = 0; x < oscCanvas.width; x += 15) {
        oCtx.beginPath(); oCtx.moveTo(x, 0); oCtx.lineTo(x, oscCanvas.height); oCtx.stroke();
      }
      for (let y = 0; y < oscCanvas.height; y += 15) {
        oCtx.beginPath(); oCtx.moveTo(0, y); oCtx.lineTo(oscCanvas.width, y); oCtx.stroke();
      }

      oCtx.strokeStyle = "#00ff00";
      oCtx.lineWidth = 2;
      oCtx.beginPath();
      const centerY = oscCanvas.height / 2;
      for (let x = 0; x < oscCanvas.width; x++) {
        const y = centerY + Math.sin((x + waveStep) * 0.08) * 10 + Math.sin((x + waveStep * 2) * 0.03) * 12;
        if (x === 0) oCtx.moveTo(x, y);
        else oCtx.lineTo(x, y);
      }
      oCtx.stroke();
      waveStep += 3;
      requestAnimationFrame(renderWave);
    }
    renderWave();

    // --- BINARY RAIN ---
    const binCanvas = document.getElementById("binaryCanvas");
    const bCtx = binCanvas.getContext("2d");

    function resizeBinary() {
      binCanvas.width = binCanvas.parentElement.clientWidth;
      binCanvas.height = binCanvas.parentElement.clientHeight;
    }
    window.addEventListener("resize", resizeBinary);
    setTimeout(resizeBinary, 50);

    const fontSize = 11;
    let columns = Math.floor(window.innerWidth / (fontSize * 2)) || 14;
    let drops = Array(columns).fill(1);

    function drawBinaryRain() {
      bCtx.fillStyle = "rgba(0, 0, 0, 0.15)";
      bCtx.fillRect(0, 0, binCanvas.width, binCanvas.height);

      bCtx.fillStyle = "#00ff00";
      bCtx.font = fontSize + "px Courier New";

      for (let i = 0; i < drops.length; i++) {
        const char = Math.random() > 0.5 ? "1" : "0";
        bCtx.fillText(char, i * (fontSize + 3), drops[i] * fontSize);

        if (drops[i] * fontSize > binCanvas.height && Math.random() > 0.95) {
          drops[i] = 0;
        }
        drops[i]++;
      }
      requestAnimationFrame(drawBinaryRain);
    }
    drawBinaryRain();
  </script>

</body>
</html>
